<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Web Emulador NFC - Teste</title>
    <style>
        /* Skin do controle virtual estilo Super Famicom (cores originais) */
        .ejs_virtualGamepad_button.cs_snes.b_a {
            background-color: #e0303d;
            border-radius: 50%;
            color: #fff;
            text-shadow: 0 1px 2px rgba(0,0,0,.5);
        }
        .ejs_virtualGamepad_button.cs_snes.b_b {
            background-color: #f4d93b;
            border-radius: 50%;
            color: #3a2f00;
            text-shadow: none;
        }
        .ejs_virtualGamepad_button.cs_snes.b_x {
            background-color: #1e7fe0;
            border-radius: 50%;
            color: #fff;
            text-shadow: 0 1px 2px rgba(0,0,0,.5);
        }
        .ejs_virtualGamepad_button.cs_snes.b_y {
            background-color: #2fae4e;
            border-radius: 50%;
            color: #fff;
            text-shadow: 0 1px 2px rgba(0,0,0,.5);
        }
        /* L e R fixados nos cantos superiores da tela, formato pilula */
        .ejs_virtualGamepad_button.cs_snes.b_l,
        .ejs_virtualGamepad_button.cs_snes.b_r {
            position: fixed !important;
            top: 14px !important;
            width: 74px !important;
            height: 38px !important;
            border-radius: 20px !important;
            background-color: rgba(60,60,60,.85);
            color: #fff;
            border: none !important;
            font-size: 18px !important;
            line-height: 38px !important;
            z-index: 20;
        }
        .ejs_virtualGamepad_button.cs_snes.b_l {
            left: 14px !important;
        }
        .ejs_virtualGamepad_button.cs_snes.b_r {
            right: 14px !important;
            left: auto !important;
        }
        /* Troca o texto ESQ/DIR (traducao) por L/R */
        .ejs_virtualGamepad_button.cs_snes.b_l,
        .ejs_virtualGamepad_button.cs_snes.b_r {
            font-size: 0 !important;
        }
        .ejs_virtualGamepad_button.cs_snes.b_l::after {
            content: "L";
            font-size: 18px;
        }
        .ejs_virtualGamepad_button.cs_snes.b_r::after {
            content: "R";
            font-size: 18px;
        }

        /* Container do Select/Start vira flex pra caber os botoes maiores sem sobrepor, centralizado de verdade */
        .ejs_virtualGamepad_bottom {
            display: flex !important;
            width: auto !important;
            gap: 14px !important;
            justify-content: center !important;
            align-items: center !important;
            position: fixed !important;
            top: auto !important;
            bottom: 14px !important;
            left: 50% !important;
            margin-left: 0 !important;
            transform: translateX(-50%) !important;
        }
        /* Rapido/Lento nao existem no controle original do SNES: removidos */
        .ejs_virtualGamepad_button.cs_snes.b_speed_fast,
        .ejs_virtualGamepad_button.cs_snes.b_speed_slow {
            display: none !important;
        }
        .ejs_virtualGamepad_button.cs_snes.b_start,
        .ejs_virtualGamepad_button.cs_snes.b_select {
            background-color: rgba(60,60,60,.4);
            border: 1px solid rgba(255,255,255,.3);
            color: #fff;
            border-radius: 16px !important;
            position: relative !important;
            left: auto !important;
            top: auto !important;
            width: auto !important;
            min-width: 74px !important;
            padding: 0 16px !important;
            white-space: nowrap !important;
            box-sizing: content-box !important;
        }
        /* Ordem correta: SELECT a esquerda, START a direita */
        .ejs_virtualGamepad_button.cs_snes.b_select { order: 1; }
        .ejs_virtualGamepad_button.cs_snes.b_start { order: 2; }

        /* Base circular cinza atras do D-pad e do diamante A/B/X/Y */
        .ejs_virtualGamepad_left,
        .ejs_virtualGamepad_right {
            background-color: rgba(50,50,50,.55);
            border-radius: 50%;
        }

        /* Em paisagem, desce o d-pad e o diamante A/B/X/Y mais para o rodape */
        @media (orientation: landscape) {
            .ejs_virtualGamepad_left,
            .ejs_virtualGamepad_right {
                position: fixed !important;
                top: auto !important;
                bottom: 6px !important;
            }
            /* Remove o transform do container pai: ele cria um novo referencial de posicao
               para filhos "fixed", o que bagunca o calculo de left/top deles */
            .ejs_virtualGamepad_bottom {
                position: static !important;
                transform: none !important;
                left: auto !important;
            }
            /* Select/Start saem do centro e ficam logo abaixo do L/R, liberando a tela do jogo */
            .ejs_virtualGamepad_button.cs_snes.b_select,
            .ejs_virtualGamepad_button.cs_snes.b_start {
                position: fixed !important;
                top: 60px !important;
                bottom: auto !important;
            }
            .ejs_virtualGamepad_button.cs_snes.b_select {
                left: 14px !important;
            }
            .ejs_virtualGamepad_button.cs_snes.b_start {
                right: 14px !important;
                left: auto !important;
            }
        }

    </style>
</head>
<body style="margin:0; padding:0; background-color:#000;">
    <div style="width:100vw; height:100vh;">
        <div id="game"></div>
    </div>

    <script>
        EJS_player = '#game';
        EJS_core = 'snes';
        EJS_gameUrl = 'lorom-template.sfc';
        EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
    </script>
    <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
    <script>
        // Em retrato, poe o L/R alguns pixels acima do d-pad/diamante de verdade
        // (medindo a posicao real deles na tela, em vez de um valor fixo que
        // varia de aparelho pra aparelho).
        (function () {
            var GAP = 16;

            function reposition() {
                var l = document.querySelector('.b_l');
                var r = document.querySelector('.b_r');
                if (!l || !r) return;

                if (!window.matchMedia('(orientation: portrait)').matches) {
                    l.style.removeProperty('top');
                    l.style.removeProperty('bottom');
                    r.style.removeProperty('top');
                    r.style.removeProperty('bottom');
                    return;
                }

                var leftZone = document.querySelector('.ejs_virtualGamepad_left');
                var rightZone = document.querySelector('.ejs_virtualGamepad_right');
                if (!leftZone || !rightZone) return;
                var leftTop = leftZone.getBoundingClientRect().top;
                var rightTop = rightZone.getBoundingClientRect().top;
                if (leftTop <= 0 || rightTop <= 0) return;

                var lBottom = Math.round(window.innerHeight - leftTop + GAP);
                var rBottom = Math.round(window.innerHeight - rightTop + GAP);
                l.style.setProperty('top', 'auto', 'important');
                l.style.setProperty('bottom', lBottom + 'px', 'important');
                r.style.setProperty('top', 'auto', 'important');
                r.style.setProperty('bottom', rBottom + 'px', 'important');
            }

            var tries = 0;
            var poll = setInterval(function () {
                tries++;
                reposition();
                if (tries > 30) clearInterval(poll);
            }, 300);

            window.addEventListener('resize', function () {
                setTimeout(reposition, 200);
            });
            window.addEventListener('orientationchange', function () {
                setTimeout(reposition, 300);
            });
        })();
    </script>
</body>
</html>
